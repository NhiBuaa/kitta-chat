name: ${K4_PROJECT_NAME:?run through the K4 lifecycle CLI}

x-k4-labels: &k4-labels
  io.kittachat.k4.project: kittachat-k4
  io.kittachat.k4.run_id: ${K4_RUN_ID:?run through the K4 lifecycle CLI}

services:
  nginx:
    image: ${K4_NGINX_IMAGE:?build or start through the K4 lifecycle CLI with an image set}
    build:
      context: .
      dockerfile: nginx/Dockerfile
    labels: *k4-labels
    depends_on:
      backend:
        condition: service_healthy
    networks: [k4-workload, k4-backend]

  backend:
    image: ${K4_BACKEND_IMAGE:?build or start through the K4 lifecycle CLI with an image set}
    build:
      context: ./server
      dockerfile: Dockerfile
      target: prod
    labels: *k4-labels
    environment:
      K4_ATTRIBUTION_ENABLED: "true"
      K4_RUN_ID: ${K4_RUN_ID:?run through the K4 lifecycle CLI}
      METRICS_ENABLED: "true"
      PORT: 3000
      MONGO_URI: mongodb://mongo:27017/kittachat_k4
      REDIS_URL: redis://redis:6379
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      JWT_SECRET: ${K4_JWT_SECRET:?run through the K4 lifecycle CLI}
      REFRESH_TOKEN_SECRET: ${K4_JWT_SECRET:?run through the K4 lifecycle CLI}
      AUTH_COOKIE_SECURE: "false"
      URL_FRONTEND: http://localhost
      CORS_ALLOWED_ORIGINS: http://localhost
      DEMO_SEED_PASSWORD: ${K4_BENCHMARK_PASSWORD:?run through the K4 lifecycle CLI}
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks: [k4-backend]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3

  mongo:
    image: mongo:7
    labels: *k4-labels
    volumes: [mongo_data:/data/db]
    networks: [k4-backend]
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 3

  redis:
    image: redis:alpine
    labels: *k4-labels
    volumes: [redis_data:/data]
    networks: [k4-backend]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  rabbitmq:
    image: rabbitmq:3-management-alpine
    labels: *k4-labels
    volumes: [rabbitmq_data:/var/lib/rabbitmq]
    networks: [k4-backend]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  runner:
    image: ${K4_RUNNER_IMAGE:?build or start through the K4 lifecycle CLI with an image set}
    build:
      context: ./scripts/k4/runner
      dockerfile: Dockerfile
    labels: *k4-labels
    command: ["node", "-e", "setInterval(() => {}, 2147483647)"]
    environment:
      K4_WORKLOAD_URL: http://nginx
      K4_BENCHMARK_EMAIL: ${K4_BENCHMARK_EMAIL:?run through the K4 lifecycle CLI}
      K4_BENCHMARK_PASSWORD: ${K4_BENCHMARK_PASSWORD:?run through the K4 lifecycle CLI}
    working_dir: /results
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - ${K4_RESULT_DIR:?run through the K4 lifecycle CLI}:/results
    networks: [k4-workload]
    depends_on:
      nginx:
        condition: service_started

  observer:
    image: ${K4_OBSERVER_IMAGE:?build or start through the K4 lifecycle CLI with an image set}
    build:
      context: .
      dockerfile: scripts/k4/observer.Dockerfile
    labels: *k4-labels
    command: ["node", "-e", "setInterval(() => {}, 2147483647)"]
    environment:
      K4_OBSERVER_TOKEN: ${K4_OBSERVER_TOKEN:?run through the K4 lifecycle CLI}
      K4_OBSERVER_HELPER_URL: http://observer-helper:8080
      K4_RUN_ID: ${K4_RUN_ID:?run through the K4 lifecycle CLI}
      K4_PROJECT_NAME: ${K4_PROJECT_NAME:?run through the K4 lifecycle CLI}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [k4-observation]
    depends_on:
      observer-helper:
        condition: service_healthy

  observer-helper:
    image: ${K4_OBSERVER_HELPER_IMAGE:?build or start through the K4 lifecycle CLI with a helper image set}
    build:
      context: .
      dockerfile: scripts/k4/observer-helper.Dockerfile
    labels: *k4-labels
    environment:
      K4_OBSERVER_TOKEN: ${K4_OBSERVER_TOKEN:?run through the K4 lifecycle CLI}
      K4_RUN_ID: ${K4_RUN_ID:?run through the K4 lifecycle CLI}
      K4_PROJECT_NAME: ${K4_PROJECT_NAME:?run through the K4 lifecycle CLI}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [k4-observation, k4-backend]
    depends_on:
      nginx:
        condition: service_started
      runner:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then((r) => { if (r.status !== 401) process.exit(1); })"]
      interval: 2s
      timeout: 2s
      retries: 15

networks:
  k4-workload:
    internal: true
    labels: *k4-labels
  k4-backend:
    internal: true
    labels: *k4-labels
  k4-observation:
    internal: true
    labels: *k4-labels

volumes:
  mongo_data:
    labels: *k4-labels
  redis_data:
    labels: *k4-labels
  rabbitmq_data:
    labels: *k4-labels
