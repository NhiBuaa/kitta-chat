# Static K3 scrape contract. This file does not start Prometheus or assert target health.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: kittachat-backend
    metrics_path: /metrics
    static_configs:
      - targets:
          - backend-1:3000
        labels:
          instance: backend-1
      - targets:
          - backend-2:3000
        labels:
          instance: backend-2
      - targets:
          - backend-3:3000
        labels:
          instance: backend-3
