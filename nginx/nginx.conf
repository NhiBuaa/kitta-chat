worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Resolve the validated backend authority through the container's system DNS
    # when nginx starts. This avoids a Docker-only resolver assumption on Railway.
    upstream kittachat_backend {
        server __BACKEND_UPSTREAM__;
        keepalive 32;
    }

    # =========================================================
    # LOGGING
    # =========================================================
    log_format main '$remote_addr - $remote_user [$time_local] '
                   '"$request_method $safe_request_uri $server_protocol" $status $body_bytes_sent '
                   '"$safe_referer" "$http_user_agent" '
                   'rt=$request_time uct=$upstream_connect_time '
                   'uht=$upstream_header_time urt=$upstream_response_time '
                   'upstream=$upstream_addr k4rid=$http_x_request_id';

    access_log /var/log/nginx/access.log main buffer=16k flush=2s;
    error_log  /var/log/nginx/error.log warn;

    # =========================================================
    # PERFORMANCE
    # =========================================================
    sendfile                on;
    tcp_nopush              on;
    tcp_nodelay             on;
    keepalive_timeout       65;
    keepalive_requests      1000;
    types_hash_max_size     2048;
    server_tokens           off;
    client_max_body_size    100m;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json
               application/javascript application/xml+rss
               text/javascript application/x-javascript;

    # =========================================================
    # VARIABLES
    # =========================================================
    # Map the Connection header for WebSocket upgrade
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    map $uri $safe_request_uri {
        ~^/reset-password/[^/]+/[^/]+$ /reset-password/[REDACTED];
        ~^/api/auth/reset-password/[^/]+/[^/]+$ /api/auth/reset-password/[REDACTED];
        default $uri;
    }

    map $http_referer $safe_referer {
        ~^https?://[^/]+/reset-password/[^/]+/[^/?#]+$ [REDACTED_RESET_REFERER];
        default $http_referer;
    }

    # =========================================================
    # RATE LIMITING ZONES
    # =========================================================
    # Per IP - General API: 10 req/s
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    # Per IP - Auth endpoints: 1 req/s (strict)
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=1r/s;

    # Per IP - Connection flood protection
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # =========================================================
    # SERVER BLOCK
    # =========================================================
    server {
        listen 80;
        server_name localhost;
        set $k6_public_demo __K6_PUBLIC_DEMO__;

        # ---------- SECURITY HEADERS ----------
        add_header X-Frame-Options       "SAMEORIGIN"                      always;
        add_header X-Content-Type-Options "nosniff"                        always;
        add_header X-XSS-Protection      "1; mode=block"                   always;
        add_header Referrer-Policy       "no-referrer"                       always;
        add_header Permissions-Policy     "camera=(self), microphone=(self), geolocation=()" always;

        # ---------- HEALTH CHECK ----------
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "OK";
        }

        # ---------- RUNTIME CONFIG: same-origin, non-secret document ----------
        location = /runtime-config.json {
            root /usr/share/nginx/html;
            default_type application/json;
            try_files /runtime-config.json =404;
        }

        # ---------- PUBLIC ROUTE EXCLUSIONS ----------
        # Backend readiness and operational diagnostics remain private. Deny exact,
        # trailing-slash, and descendant forms before static/SPA resolution.
        location ~ ^/(?:readyz|ops|metrics|backend-healthz)(?:/|$) {
            access_log off;
            default_type text/plain;
            return 404 "Not Found";
        }

        # Exact local diagnostic adapters remain available only when the rendered
        # target is the explicit non-public-demo local-compose adapter.
        location = /backend-healthz {
            if ($k6_public_demo = 1) { return 404; }
            proxy_pass http://kittachat_backend/healthz;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /readyz {
            if ($k6_public_demo = 1) { return 404; }
            proxy_pass http://kittachat_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /ops {
            internal;
            proxy_pass http://kittachat_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /api {
            default_type text/plain;
            return 404 "Not Found";
        }

        location = /socket.io {
            default_type text/plain;
            return 404 "Not Found";
        }

        # ---------- API: REST Endpoints ----------
        location ^~ /api/ {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass         http://kittachat_backend;
            proxy_http_version 1.1;
            # BẬT keepalive - reuse connection pool
            proxy_set_header   Connection "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Origin            $http_origin;
            proxy_set_header   Accept            $http_accept;

            proxy_connect_timeout 60s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;

            proxy_buffering    on;
            proxy_buffer_size  4k;
            proxy_buffers      8 4k;
        }

        # ---------- AUTH: Stricter rate limit ----------
        location ^~ /api/auth/ {
            limit_req zone=auth_limit burst=5 nodelay;

            proxy_pass         http://kittachat_backend;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Origin            $http_origin;
            proxy_set_header   Accept            $http_accept;

            proxy_connect_timeout 30s;
            proxy_send_timeout    30s;
            proxy_read_timeout    30s;
        }

        # ---------- WEBSOCKET: Socket.IO ----------
        location ^~ /socket.io/ {
            limit_conn conn_limit 10;

            proxy_pass         http://kittachat_backend;
            proxy_http_version 1.1;

            # WebSocket upgrade headers - giữ nguyên "upgrade"
            # KHÔNG set Connection "" vì WS cần upgrade
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;
            proxy_set_header   Host       $host;
            proxy_set_header   X-Real-IP  $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Origin $http_origin;

            # WebSocket timeout phải LỚN - Socket.IO ping/pong ~20s interval
            proxy_read_timeout  86400s;
            proxy_send_timeout  86400s;

            # TẮT buffering cho WebSocket - CRITICAL
            proxy_buffering off;
        }

        # ---------- FRONTEND: deterministic static and SPA precedence ----------
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|map)$ {
            root /usr/share/nginx/html;
            try_files $uri =404;
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # Keep every edge-generated 404 generic and non-HTML. Proxied backend
        # responses are not intercepted because proxy_intercept_errors stays off.
        error_page 404 = @edge_not_found;
        location @edge_not_found {
            default_type text/plain;
            return 404 "Not Found";
        }

        # ---------- ERROR PAGES ----------
        # NOTE: 503 = Rate Limited. Commented out vì /50x.html không tồn tại trong React dist
        # -> rate limited request sẽ nhận 503 trực tiếp từ nginx thay vì 404 ảo
        error_page 500 502 504 /50x.html;
        # error_page 503 444;  # trả thẳng 503, không redirect
        location = /50x.html {
            root /usr/share/nginx/html;
        }

        # ---------- BLOCK SUSPICIOUS PATTERNS ----------
        if ($query_string ~* "union.*select.*from") { return 444; }
        if ($request_uri ~* "\.(htaccess|htpasswd|config|bak|orig|old|save|log|sql|xml|csv|mdb|ini|phtml|php|pl|cgi)$") {
            return 444;
        }
    }
}
