services:
  backend:
    image: node:22
    pull_policy: never
    working_dir: /workspace
    command: ["node", "scripts/k6/edgeFixtureBackend.cjs"]
    read_only: true
    environment:
      NODE_PATH: /dependencies/node_modules
      PORT: "3000"
    volumes:
      - "${K6_112_CANDIDATE_ROOT}:/workspace:ro"
      - "${K6_112_SERVER_NODE_MODULES}:/dependencies/node_modules:ro"
    expose:
      - "3000"
    networks:
      default:
        aliases:
          - backend.internal.test
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/__control/health').then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))"]
      interval: 1s
      timeout: 2s
      retries: 20

  edge:
    image: "${K6_112_EDGE_IMAGE}"
    pull_policy: never
    environment:
      K6_TARGET: public-demo
      BACKEND_UPSTREAM: backend.internal.test:3000
      K6_EDGE_ALLOW_TEST_UPSTREAM: "true"
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${K6_112_EDGE_PORT}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz | grep -qx OK"]
      interval: 1s
      timeout: 2s
      retries: 20
