name: Quality

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  client-lint:
    name: Client Lint
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          working-directory: client
          cache-dependency-path: client/package-lock.json

      - name: Run client lint readiness
        run: npm run lint:ci

  ci-policy-baseline:
    name: Trusted CI Policy v1 Baseline
    uses: NhiBuaa/kitta-chat/.github/workflows/ci-policy-v1.yml@085647d5a1727e1ad06ca7e444c9ee1291138d0a # CI Policy v1

  ci-policy-v1:
    name: CI Policy v1
    needs: ci-policy-baseline
    if: ${{ always() }}
    runs-on: ubuntu-latest

    steps:
      - name: Enforce trusted policy result
        env:
          POLICY_RESULT: ${{ needs.ci-policy-baseline.result }}
        run: test "$POLICY_RESULT" = "success"
