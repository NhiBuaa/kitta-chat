name: CI Policy v1 Support

on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate-policy:
    name: Trusted CI Policy v1
    runs-on: ubuntu-latest

    steps:
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: candidate

      - name: Checkout trusted policy baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: NhiBuaa/kitta-chat
          ref: 02cd5acb30fac89b0bfcbc2f8cf30634a536c62d
          path: policy

      - name: Setup trusted policy runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: policy/.nvmrc
          cache: npm
          cache-dependency-path: policy/package-lock.json

      - name: Install trusted policy dependencies
        run: npm ci
        working-directory: policy

      - name: Validate candidate with trusted baseline
        run: node policy/scripts/ci/validateCiContract.cjs candidate --require-ci-policy

      - name: Install candidate policy dependencies
        run: npm ci
        working-directory: candidate

      - name: Run candidate policy tests
        run: npm run test:ci
        working-directory: candidate

      - name: Validate candidate policy implementation
        run: npm run ci:validate
        working-directory: candidate
